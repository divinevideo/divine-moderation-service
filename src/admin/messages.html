<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Divine Moderation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header h1 {
      color: #fff;
      font-size: 22px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-actions a,
    .header-actions button {
      background: #333;
      color: #e0e0e0;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .header-actions a:hover,
    .header-actions button:hover {
      background: #444;
    }

    .header-actions .btn-primary {
      background: #2563eb;
      color: white;
    }

    .header-actions .btn-primary:hover {
      background: #1d4ed8;
    }

    .main-container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* --- Left Panel: Conversation List --- */
    .conversation-list {
      width: 30%;
      min-width: 280px;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
    }

    .conversation-list-header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conversation-list-header input {
      width: 100%;
      padding: 6px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      text-transform: none;
      letter-spacing: normal;
      outline: none;
    }

    .conversation-list-header input:focus {
      border-color: #2563eb;
    }

    .conv-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .conversation-items {
      flex: 1;
      overflow-y: auto;
    }

    .conversation-item {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .conversation-item:hover {
      background: #1a1a1a;
    }

    .conversation-item.active {
      background: #1a2332;
      border-left: 3px solid #2563eb;
    }

    .conversation-item .pubkey {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      font-family: "SF Mono", "Fira Code", monospace;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .conversation-item .preview {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .conversation-item .meta {
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-report {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .badge-moderation {
      background: #713f12;
      color: #fde68a;
    }

    .badge-general {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      background: #2563eb;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: #555;
      font-size: 13px;
    }

    /* --- Right Panel: Thread View --- */
    .thread-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .thread-header {
      padding: 12px 20px;
      border-bottom: 1px solid #222;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .thread-header .thread-pubkey {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .thread-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message-bubble.incoming {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message-bubble.outgoing {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-bubble .bubble-meta {
      font-size: 11px;
      margin-top: 6px;
      opacity: 0.6;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Optimistic outgoing bubble awaiting the publish round-trip. */
    .message-bubble.pending {
      opacity: 0.6;
    }

    .message-bubble .pending-tag {
      font-style: italic;
    }

    .message-bubble .video-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #93c5fd;
      text-decoration: none;
    }

    .message-bubble.outgoing .video-link {
      color: #bfdbfe;
    }

    .message-bubble .video-link:hover {
      text-decoration: underline;
    }

    .message-bubble .type-tag {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      background: rgba(255,255,255,0.15);
    }

    /* --- Compose Box --- */
    .compose-box {
      padding: 16px 20px;
      border-top: 1px solid #333;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .compose-row {
      display: flex;
      gap: 10px;
    }

    .compose-box textarea {
      flex: 1;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 120px;
    }

    .compose-box textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .compose-box .send-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
      align-self: flex-end;
    }

    .compose-box .send-btn:hover {
      background: #1d4ed8;
    }

    .compose-box .send-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .compose-extras {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .compose-extras label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .compose-extras input {
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      width: 200px;
    }

    .compose-extras input:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .conversation-list {
        width: 100%;
        min-width: unset;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid #333;
      }

      .thread-panel {
        min-height: 0;
      }

      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Messages</h1>
    <div class="header-actions">
      <a href="/admin/dashboard">Back to Dashboard</a>
      <button class="btn-primary" onclick="openNewMessage()">New Message</button>
      <button class="btn-primary" onclick="refreshAll()">Refresh</button>
    </div>
  </div>

  <div class="main-container">
    <!-- Left Panel -->
    <div class="conversation-list">
      <div class="conversation-list-header">
        <span>Conversations</span>
        <input type="text" id="search-input" placeholder="Search by name or pubkey..."
          oninput="filterConversations(this.value)">
      </div>
      <div class="conversation-items" id="conversation-items">
        <div class="loading-state" id="conv-loading">
          <div class="spinner"></div>
          <span>Loading conversations...</span>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="thread-panel" id="thread-panel">
      <div class="empty-state" id="thread-placeholder">
        Select a conversation, or start a New Message
      </div>
      <div id="new-recipient-bar" style="display:none; padding:12px; border-bottom:1px solid #333;">
        <input type="text" id="recipient-input" placeholder="@username.divine.video, npub, hex pubkey, or user@domain"
          style="width:60%;" onkeydown="if(event.key==='Enter'){event.preventDefault();resolveRecipient();}">
        <button class="btn-primary" onclick="resolveRecipient()">Start</button>
        <span id="recipient-status" style="margin-left:10px; font-size:13px;"></span>
      </div>
      <div id="thread-content" style="display: none; flex-direction: column; height: 100%;">
        <div class="thread-header">
          <span class="thread-pubkey" id="thread-pubkey"></span>
        </div>
        <div class="thread-messages" id="thread-messages">
          <div class="loading-state" id="thread-loading" style="display: none;">
            <div class="spinner"></div>
            <span>Loading messages...</span>
          </div>
        </div>
        <div class="compose-box">
          <div class="compose-row">
            <textarea id="compose-input" placeholder="Type a message..." rows="1"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
          </div>
          <div class="compose-extras">
            <label>Template:</label>
            <select id="template-select" onchange="applyTemplate(this.value)">
              <option value="">— none —</option>
            </select>
            <label>Link video:</label>
            <input type="text" id="compose-sha256" placeholder="sha256 (optional)" onchange="loadTemplates()">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedPubkey = null;
    let conversations = [];
    let profileCache = {};

    // --- Helpers ---

    function truncatePubkey(hex) {
      if (!hex) return '(unknown)';
      if (hex.length <= 16) return hex;
      return hex.slice(0, 8) + '...' + hex.slice(-8);
    }

    // SQLite's CURRENT_TIMESTAMP default writes "YYYY-MM-DD HH:MM:SS" in UTC
    // with no timezone marker. Chrome parses that ambiguous format as local
    // time, which flips recent rows into the future and makes relativeTime
    // clamp to "just now" forever. Treat any SQLite-shaped string as UTC.
    function parseTimestamp(ts) {
      if (!ts) return NaN;
      if (typeof ts === 'number') return ts * 1000;
      if (typeof ts !== 'string') return new Date(ts).getTime();
      // Already has explicit timezone (Z, +00:00, -05:00, etc.) — trust it.
      if (/[zZ]$|[+-]\d{2}:?\d{2}$/.test(ts)) return new Date(ts).getTime();
      // SQLite style: "YYYY-MM-DD HH:MM:SS" — force UTC interpretation.
      return new Date(ts.replace(' ', 'T') + 'Z').getTime();
    }

    function relativeTime(ts) {
      const date = parseTimestamp(ts);
      if (!Number.isFinite(date)) return '';
      const now = Date.now();
      const diff = Math.max(0, now - date);
      const seconds = Math.floor(diff / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      if (days < 30) return days + 'd ago';
      return new Date(date).toLocaleDateString();
    }

    function badgeClass(messageType) {
      if (!messageType) return 'badge-general';
      if (messageType.includes('report')) return 'badge-report';
      if (messageType.includes('moderation') || messageType.includes('quarantine') || messageType.includes('ban')) return 'badge-moderation';
      return 'badge-general';
    }

    function badgeLabel(messageType) {
      if (!messageType) return '';
      // Convert snake_case to Title Case
      return messageType.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // --- Profile Resolution ---

    async function fetchProfiles(pubkeys) {
      if (!pubkeys.length) return;
      const unique = [...new Set(pubkeys)].filter(p => !profileCache[p]);
      if (!unique.length) return;
      try {
        const res = await fetch('/admin/api/profiles?pubkeys=' + unique.join(','));
        if (res.ok) {
          const data = await res.json();
          Object.assign(profileCache, data);
        }
      } catch (err) {
        console.error('fetchProfiles error:', err);
      }
    }

    function displayName(pubkey) {
      const profile = profileCache[pubkey];
      return profile?.display_name || profile?.name || truncatePubkey(pubkey);
    }

    function avatarHtml(pubkey) {
      const profile = profileCache[pubkey];
      if (profile?.picture) {
        return `<img class="conv-avatar" src="${escapeHtml(profile.picture)}" alt="">`;
      }
      return '';
    }

    // --- Search / Filter ---

    function filterConversations(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderConversationList(conversations);
        return;
      }

      const filtered = conversations.filter(conv => {
        const pubkey = conv.participant_pubkey || conv.pubkey || '';
        const profile = profileCache[pubkey];
        const name = (profile?.display_name || profile?.name || '').toLowerCase();
        const nip05 = (profile?.nip05 || '').toLowerCase();
        return pubkey.includes(q) || name.includes(q) || nip05.includes(q);
      });

      renderConversationList(filtered);
    }

    function currentConversationSearch() {
      return document.getElementById('search-input')?.value || '';
    }

    // --- Fetch conversations ---

    async function fetchConversations() {
      const container = document.getElementById('conversation-items');
      const loading = document.getElementById('conv-loading');
      loading.style.display = 'flex';

      try {
        const res = await fetch('/admin/api/messages?limit=50');
        if (!res.ok) throw new Error('Failed to fetch conversations');
        const data = await res.json();
        conversations = data.conversations || data || [];

        // Paint immediately — displayName() falls back to the truncated pubkey,
        // so rows show last message + timestamp without waiting on the
        // relay-bound profile lookup. Then fetch profiles in the background and
        // re-render to patch in names/avatars when they arrive.
        renderConversations();
        const pubkeys = conversations.map(c => c.participant_pubkey || c.pubkey).filter(Boolean);
        fetchProfiles(pubkeys).then(() => renderConversations()).catch(() => {});
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Failed to load conversations</div>';
        console.error('fetchConversations error:', err);
      }
    }

    function renderConversations() {
      filterConversations(currentConversationSearch());
    }

    function renderConversationList(list) {
      const container = document.getElementById('conversation-items');

      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No conversations yet</div>';
        return;
      }

      container.innerHTML = list.map(conv => {
        const pubkey = conv.participant_pubkey || conv.pubkey || '';
        const preview = (conv.latest_message || conv.preview || '').slice(0, 80);
        const ts = conv.last_message_at || conv.updated_at || conv.created_at;
        const msgType = conv.message_type || conv.latest_message_type || '';
        const unread = Boolean(conv.unread);
        const isActive = pubkey === selectedPubkey;

        return `
          <div class="conversation-item ${isActive ? 'active' : ''}" onclick="selectConversation('${pubkey}')">
            <div class="pubkey">
              ${unread ? '<span class="unread-dot"></span>' : ''}
              ${avatarHtml(pubkey)}
              ${escapeHtml(displayName(pubkey))}
            </div>
            <div class="preview">${escapeHtml(preview) || '(no messages)'}</div>
            <div class="meta">
              <span>${relativeTime(ts)}</span>
              ${msgType ? '<span class="badge ' + badgeClass(msgType) + '">' + escapeHtml(badgeLabel(msgType)) + '</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Select conversation & load thread ---

    async function selectConversation(pubkey, opts = {}) {
      selectedPubkey = pubkey;

      // Optimistically clear the unread dot for this row, then tell the
      // backend so it stays clear on the next fetchConversations() poll.
      // Fire-and-forget: a failed mark-read shouldn't block opening the
      // thread, it just means the dot may reappear next refresh.
      const conv = conversations.find(c => (c.participant_pubkey || c.pubkey) === pubkey);
      if (conv && conv.unread) {
        conv.unread = false;
        fetch('/admin/api/messages/' + encodeURIComponent(pubkey) + '/read', { method: 'POST' }).catch(() => {});
      }

      renderConversations();

      // Dismiss the New Message recipient bar unless we just resolved from it
      // (resolveRecipient keeps it to show the verified confirmation).
      if (!opts.keepRecipientBar) {
        document.getElementById('new-recipient-bar').style.display = 'none';
        document.getElementById('recipient-status').textContent = '';
      }

      document.getElementById('thread-placeholder').style.display = 'none';
      const content = document.getElementById('thread-content');
      content.style.display = 'flex';

      const profile = profileCache[pubkey];
      const threadHeader = document.getElementById('thread-pubkey');
      if (profile) {
        threadHeader.innerHTML = (profile.picture ? `<img class="conv-avatar" src="${escapeHtml(profile.picture)}" alt=""> ` : '')
          + escapeHtml(profile.display_name || profile.name || truncatePubkey(pubkey))
          + (profile.nip05 ? ` <span style="color:#888;font-size:12px;">(${escapeHtml(profile.nip05)})</span>` : '')
          + ` <span style="color:#555;font-size:11px;font-family:monospace;">${truncatePubkey(pubkey)}</span>`;
      } else {
        threadHeader.textContent = truncatePubkey(pubkey);
      }
      document.getElementById('compose-input').value = '';
      document.getElementById('compose-sha256').value = '';

      await loadThread(pubkey);
    }

    async function loadThread(pubkey) {
      const container = document.getElementById('thread-messages');
      const loading = document.getElementById('thread-loading');
      loading.style.display = 'flex';
      // Clear old messages but keep loading indicator
      Array.from(container.children).forEach(child => {
        if (child.id !== 'thread-loading') child.remove();
      });

      try {
        const res = await fetch('/admin/api/messages/' + encodeURIComponent(pubkey));
        if (!res.ok) throw new Error('Failed to load thread');
        const data = await res.json();
        const messages = data.messages || data || [];
        loading.style.display = 'none';
        renderThread(messages);
      } catch (err) {
        loading.style.display = 'none';
        container.innerHTML += '<div class="empty-state">Failed to load messages</div>';
        console.error('loadThread error:', err);
      }
    }

    function renderThread(messages) {
      const container = document.getElementById('thread-messages');
      // Clear all except loading indicator
      Array.from(container.children).forEach(child => {
        if (child.id !== 'thread-loading') child.remove();
      });

      if (!messages.length) {
        const el = document.createElement('div');
        el.className = 'empty-state';
        el.textContent = 'No messages yet — start the conversation';
        container.appendChild(el);
        return;
      }

      messages.forEach(msg => container.appendChild(createMessageBubble(msg)));

      // Auto-scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Build a single message bubble. Shared by renderThread (server rows) and
    // the optimistic-send append path (a pending outgoing bubble).
    function createMessageBubble(msg) {
      const direction = msg.direction || (msg.from_moderator ? 'outgoing' : 'incoming');
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble ' + direction + (msg.pending ? ' pending' : '');

      let html = '<div>' + escapeHtml(msg.content || msg.message || '') + '</div>';

      if (msg.sha256) {
        const sha256 = String(msg.sha256);
        html += '<a class="video-link" href="/admin/video/' + encodeURIComponent(sha256) + '" target="_blank">View video: ' + escapeHtml(sha256.slice(0, 12)) + '...</a>';
      }

      html += '<div class="bubble-meta">';
      if (msg.pending) {
        html += '<span class="pending-tag">Sending…</span>';
      } else {
        const ts = msg.created_at || msg.timestamp;
        html += '<span>' + relativeTime(ts) + '</span>';
        if (msg.message_type) {
          html += '<span class="type-tag">' + escapeHtml(badgeLabel(msg.message_type)) + '</span>';
        }
      }
      html += '</div>';

      bubble.innerHTML = html;
      return bubble;
    }

    // Optimistically append an outgoing bubble (used by sendMessage before the
    // publish round-trip resolves). Returns the bubble node so the caller can
    // mark it delivered or revert it.
    function appendOutgoingBubble(text, sha256, { pending } = {}) {
      const container = document.getElementById('thread-messages');
      const empty = container.querySelector('.empty-state');
      if (empty) empty.remove();
      const bubble = createMessageBubble({ direction: 'outgoing', content: text, sha256: sha256 || null, pending });
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    // --- Send message ---

    async function sendMessage() {
      if (!selectedPubkey) return;
      const input = document.getElementById('compose-input');
      const sha256Input = document.getElementById('compose-sha256');
      const sendBtn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;

      const sha256 = sha256Input.value.trim();
      const body = { message: text };
      if (sha256) body.sha256 = sha256;

      // Snapshot the target thread: the moderator can switch conversations
      // while the publish is in flight, and selectedPubkey would change under
      // us — we must POST to (and reconcile against) the thread we sent from.
      const targetPubkey = selectedPubkey;

      // Optimistic: append a pending bubble and clear the composer immediately,
      // so the UI doesn't block on the relay-bound publish round-trip. On
      // success we mark the bubble delivered; on failure we revert (remove the
      // bubble, restore the typed text) so the moderator can retry.
      const pendingBubble = appendOutgoingBubble(text, sha256, { pending: true });
      input.value = '';
      sha256Input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/admin/api/messages/' + encodeURIComponent(targetPubkey), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || 'Failed to send message');
        }

        // Delivered: drop the pending state and stamp a timestamp — but only if
        // the bubble is still in the DOM. If the moderator navigated/refreshed
        // mid-send it was wiped; the server render on next open of that thread
        // shows the logged row, so there's nothing to reconcile here.
        if (pendingBubble.isConnected) {
          pendingBubble.classList.remove('pending');
          const meta = pendingBubble.querySelector('.bubble-meta');
          if (meta) meta.innerHTML = '<span>' + relativeTime(new Date().toISOString()) + '</span>';
        }
      } catch (err) {
        // Revert: remove the optimistic bubble if still present, and restore the
        // typed text only if we're still on the same thread (the composer is a
        // single shared element — don't dump this thread's text into another).
        if (pendingBubble.isConnected) {
          pendingBubble.remove();
          // If that was the only bubble (failed first message of an empty
          // thread), restore the "no messages yet" placeholder appendOutgoingBubble removed.
          const threadContainer = document.getElementById('thread-messages');
          if (!threadContainer.querySelector('.message-bubble')) renderThread([]);
        }
        if (selectedPubkey === targetPubkey) {
          input.value = text;
          if (sha256) sha256Input.value = sha256;
        }
        alert('Failed to send message: ' + err.message);
        console.error('sendMessage error:', err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // --- Refresh ---

    async function refreshAll() {
      try {
        // Trigger sync first
        await fetch('/admin/api/messages/sync', { method: 'POST' }).catch(() => {});
      } catch (e) {
        // sync endpoint may not exist yet; ignore
      }
      await fetchConversations();
      if (selectedPubkey) {
        await loadThread(selectedPubkey);
      }
    }

    // --- New Message compose ---

    function openNewMessage() {
      document.getElementById('thread-placeholder').style.display = 'none';
      const bar = document.getElementById('new-recipient-bar');
      bar.style.display = 'block';
      document.getElementById('recipient-status').textContent = '';
      const input = document.getElementById('recipient-input');
      input.value = '';
      input.focus();
    }

    async function resolveRecipient() {
      const input = document.getElementById('recipient-input').value.trim();
      const status = document.getElementById('recipient-status');
      if (!input) return;
      status.style.color = '#888';
      status.textContent = 'Resolving…';
      try {
        const res = await fetch('/admin/api/recipient/resolve?input=' + encodeURIComponent(input));
        if (!res.ok) {
          status.style.color = '#e66';
          status.textContent = res.status === 404
            ? "Couldn't verify that nip-05. If you have their npub or pubkey, paste it instead."
            : 'Invalid recipient. Paste an npub, hex pubkey, or user@domain.';
          return;
        }
        const data = await res.json();
        const label = data.source === 'nip05'
          ? '✓ ' + escapeHtml(data.display || data.address) + ' (verified)'
          : '✓ ' + truncatePubkey(data.pubkey);
        status.style.color = '#6c6';
        status.innerHTML = label;
        // Keep the bar + verified confirmation visible as a "to:" indicator;
        // selectConversation dismisses it when the moderator navigates elsewhere.
        await fetchProfiles([data.pubkey]);
        await selectConversation(data.pubkey, { keepRecipientBar: true });
      } catch (err) {
        status.style.color = '#e66';
        status.textContent = 'Resolution failed. Try again.';
        console.error('resolveRecipient error:', err);
      }
    }

    // --- Templates ---

    let templateCache = [];

    async function loadTemplates() {
      const sha = document.getElementById('compose-sha256')?.value?.trim();
      const qs = sha ? '?sha256=' + encodeURIComponent(sha) : '';
      try {
        const res = await fetch('/admin/api/dm-templates' + qs);
        if (!res.ok) return;
        templateCache = await res.json();
        const select = document.getElementById('template-select');
        select.innerHTML = '<option value="">— none —</option>'
          + templateCache.map((t, i) => '<option value="' + i + '">' + escapeHtml(t.label) + '</option>').join('');
      } catch (err) {
        console.error('loadTemplates error:', err);
      }
    }

    function applyTemplate(index) {
      const select = document.getElementById('template-select');
      if (index === '') return;
      const tpl = templateCache[Number(index)];
      if (tpl && tpl.body) {
        const composeInput = document.getElementById('compose-input');
        if (composeInput.value.trim() && !confirm('Replace your current draft with this template?')) {
          select.value = '';
          return;
        }
        composeInput.value = tpl.body;
      }
      // Reset to "— none —" so re-selecting the same template re-fires onchange.
      select.value = '';
    }

    // --- Auto-resize textarea ---

    document.getElementById('compose-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // --- Init ---
    (async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const preselectedPubkey = urlParams.get('pubkey');

      await fetchConversations();
      loadTemplates();

      if (preselectedPubkey) {
        // Fetch profile for the preselected pubkey if not already cached
        await fetchProfiles([preselectedPubkey]);
        await selectConversation(preselectedPubkey);
      }
    })();
  </script>
</body>
</html>
