# Divine Video Moderation Service
name = "divine-moderation-service"
main = "src/index.mjs"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Serve production traffic only on divine.video hostnames.
workers_dev = false

# Custom domains (requires divine.video zone in the same Cloudflare account)
routes = [
  { pattern = "moderation.admin.divine.video/*", zone_name = "divine.video" },
  { pattern = "moderation-api.divine.video/*", zone_name = "divine.video" }
]

# KV for storing moderation results
[[kv_namespaces]]
binding = "MODERATION_KV"
id = "10af689fc82140ed9159eef3c1c47079"

# D1 database for Blossom webhook events (video uploads)
[[d1_databases]]
binding = "BLOSSOM_DB"
database_name = "blossom-webhook-events"
database_id = "829f06cf-294b-4491-8611-30fc53df2589"
migrations_dir = "migrations"

# Queue producer configuration (for testing)
[[queues.producers]]
binding = "MODERATION_QUEUE"
queue = "video-moderation-queue"

# Queue consumer configuration
[[queues.consumers]]
queue = "video-moderation-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Service binding to the relay-admin worker (divine-relay-admin-api-prod) for
# ban/unban/delete-event RPCs. Worker-to-worker, so it bypasses the public CF
# edge and CF Access (the source of the deprecated /api/moderate 522 and the
# per-card Ban User 502, issue #170) and avoids relay-admin cold starts. The
# relay-admin worker authorizes server-to-server callers via the X-Admin-Key
# header (divine-relay-manager worker/src/index.ts). When the binding is absent
# the code falls back to the public-edge HTTPS + CF Access path.
[[services]]
binding = "RELAY_ADMIN"
service = "divine-relay-admin-api-prod"

# Shared X-Admin-Key sent on the RELAY_ADMIN binding calls. Secrets Store secret
# (MODERATION_TO_RELAY_ADMIN_KEY), the same secret divine-relay-manager binds as
# MOD_RELAY_ADMIN_KEY, so both sides reference one value (#170). Resolved in code
# via .get(); a plain string is also accepted for local dev.
#
# DEPLOY NOTE: binding a Secrets Store secret requires the deploy token
# (CLOUDFLARE_API_TOKEN in CI) to have account "Secrets Store: Write" (Edit)
# permission, not just Read — otherwise wrangler deploy fails with code 10021.
# The CI token is the account token "divine-moderation-service-ci-deploy".
[[secrets_store_secrets]]
binding = "RELAY_ADMIN_API_KEY"
store_id = "ef490704b12a4feb91c7feb51229c364"
secret_name = "MODERATION_TO_RELAY_ADMIN_KEY"

# Environment variables
[vars]
MODERATION_ENABLED = "true"
CDN_DOMAIN = "media.divine.video"  # CDN domain for video access
PRIMARY_MODERATION_PROVIDER = "manual-review"  # legacy default; ignored when REACTIVE_MODERATION_ONLY=true
REACTIVE_MODERATION_ONLY = "true"  # Reactive moderation: queue consumer ack-skips all messages; reports write D1 rows directly

# Zero Trust JWT verification (for /api/v1/moderate endpoint)
TEAM_DOMAIN = "https://divinevideo.cloudflareaccess.com"  # Cloudflare Access team domain

# Legacy automated-classifier thresholds (0.0 - 1.0). The upload pipeline no longer
# calls external moderation providers; these remain for isolated classifier/provider tests
# and any explicit future tooling that opts back into automated scoring.
# NSFW / Adult Content
NSFW_THRESHOLD_HIGH = "0.8"           # Age-restricted
NSFW_THRESHOLD_MEDIUM = "0.6"         # Human review

# Violence
VIOLENCE_THRESHOLD_HIGH = "0.8"       # Age-restricted
VIOLENCE_THRESHOLD_MEDIUM = "0.6"     # Human review

# Gore & Disgusting
GORE_THRESHOLD_HIGH = "0.8"           # Age-restricted (PERMANENT_BAN if > 0.95)
GORE_THRESHOLD_MEDIUM = "0.6"         # Human review

# Hate Speech & Offensive Symbols (Nazi, KKK, etc)
OFFENSIVE_THRESHOLD_HIGH = "0.8"      # PERMANENT_BAN
OFFENSIVE_THRESHOLD_MEDIUM = "0.6"    # Human review

# Weapons (Firearms, Knives, Threats)
WEAPON_THRESHOLD_HIGH = "0.8"         # Age-restricted
WEAPON_THRESHOLD_MEDIUM = "0.6"       # Human review

# Recreational Drugs
DRUG_THRESHOLD_HIGH = "0.8"           # Age-restricted
DRUG_THRESHOLD_MEDIUM = "0.6"         # Human review

# Self-Harm (CRITICAL - Lower thresholds)
SELF_HARM_THRESHOLD_HIGH = "0.7"      # PERMANENT_BAN
SELF_HARM_THRESHOLD_MEDIUM = "0.5"    # Human review

# AI-Generated / Deepfake Detection
AI_GENERATED_THRESHOLD_HIGH = "0.8"   # Age-restricted
AI_GENERATED_THRESHOLD_MEDIUM = "0.6" # Human review

# Divine-inquisitor C2PA/ProofMode verification service (github.com/divinevideo/divine-inquisitor)
# Called for human-review context only; it no longer short-circuits uploads to automated enforcement.
INQUISITOR_BASE_URL = "https://inquisitor.divine.video"

# divine-ai-detector service base URL. The Worker posts per-signal detection
# requests to {AI_DETECTOR_BASE_URL}/detect and gets back per-signal envelopes
# (see docs/superpowers/plans/2026-04-17-divine-ai-detector-design.md §API).
# Empty string = client disabled; every signal resolves to an `error` envelope
# and callers fall through to vendor (Hive / Reality Defender).
AI_DETECTOR_BASE_URL = ""

# DEPRECATED — kept so deployed configs that still set this don't break during
# cutover. The client reads it as a fallback only when AI_DETECTOR_BASE_URL is
# empty. Remove after every environment has been migrated.
LOGO_DETECTOR_MODEL_URL = ""

# Per-signal cutover mode: shadow | gated | preferred | sole (default shadow).
# - shadow    : call vendor + internal, use vendor, log disagreement
# - gated     : internal when confidence >= AI_DETECTOR_GATE_<SIGNAL>
# - preferred : internal whenever state != error
# - sole      : internal only, vendor not called
# Flipping this is a runtime rollout decision, not a PR decision.
AI_DETECTOR_MODE_WATERMARK_VISIBLE = "shadow"

# Confidence gate used by `gated` mode. Spec: 0.8 is the Hive-equivalent high
# threshold; 0.7 is moderate. Tune from shadow-mode agreement data.
AI_DETECTOR_GATE_WATERMARK_VISIBLE = "0.8"

# Relay Polling Configuration
RELAY_POLLING_ENABLED = "true"                    # Enable/disable relay polling
RELAY_POLLING_RELAY_URL = "wss://relay.divine.video"  # Relay to poll for new video events
RELAY_POLLING_LOOKBACK_HOURS = "1"                # How far back to look for events (in hours)
RELAY_POLLING_LIMIT = "100"                       # Max events to fetch per poll
REPORT_POLLING_ENABLED = "true"                   # Enable/disable inbound NIP-56 report polling
REPORT_POLLING_RELAY_URL = "wss://relay.divine.video" # Relay to poll for kind 1984 reports
REPORT_POLLING_LOOKBACK_HOURS = "24"              # How far back to look for reports on first run
REPORT_POLLING_LIMIT = "100"                      # Max reports to fetch per poll
REPORT_POLLING_MAX_PAGES = "5"                    # Max bounded pages to drain per report poll
RELAY_REPORTS_REQUIRE_DIVINE_CLIENT = "true"      # Only ingest reports tagged as sent by diVine

# Funnelcake admin URL — destination for notifyRelay() NIP-98 add/remove
# webhooks against /api/moderation/quarantine. Empty string = relay-side
# enforcement disabled (notifyRelay returns skipped). Signed with NOSTR_PRIVATE_KEY,
# so the corresponding pubkey must be in funnelcake's ADMIN_PUBKEYS.
FUNNELCAKE_ADMIN_URL = "https://relay.divine.video"

# Funnelcake read host for per-card admin video lookups (GET /api/videos/{id}).
# The CDN-cached path; env-overridable so staging can point at its own funnelcake
# host. The admin/NIP-98 write path above stays on the relay and is unaffected.
FUNNELCAKE_LOOKUP_URL = "https://api.divine.video"

# Legacy moderation_results lookup-column backfill (perf/dashboard-speedup).
# Off by default; flip to "true" via `wrangler secret put` after the manual
# trigger /admin/api/backfill/run has been verified on a small batch.
BACKFILL_ENABLED = "false"
BACKFILL_ROWS_PER_TICK = "200"

# Creator-delete pipeline feature flag (default off; flip to "true" via `wrangler secret put` or [vars] once ready)
CREATOR_DELETE_PIPELINE_ENABLED = "true"

# moderation@ NIP-17 DM inbox relay list (kind 10050) publish. Ships dormant; flip
# to "true" only AFTER divine-funnelcake#536 is live in prod so the relay accepts
# kind 10050. Optional DM_INBOX_DISCOVERY_RELAYS overrides the default aggregator
# list (purplepag.es, relay.nostr.band, relay.damus.io).
DM_INBOX_PUBLISH_ENABLED = "false"
# Relay used to fetch creator kind 5 delete events and target video events.
CREATOR_DELETE_RELAY_URL = "wss://relay.divine.video"

# Cron trigger for relay polling - runs every 5 minutes
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

# Secrets (set with: wrangler secret put <NAME>)
# SERVICE_API_TOKEN - bearer token for authenticated requests to moderation-api.divine.video
# POLICY_AUD - Zero Trust application audience tag (from Access > Applications > moderation.admin.divine.video > Overview)
# CF_ACCESS_CLIENT_ID - Cloudflare Access service token ID for relay.divine.video
# CF_ACCESS_CLIENT_SECRET - Cloudflare Access service token secret for relay.divine.video
# NOSTR_PRIVATE_KEY - for signing NIP-56 report events to faro.nos.social
# MODERATOR_NSEC - Nostr private key (hex) for signing NIP-32 label events from human moderators
# NOSTR_RELAY_URL - Nostr relay for publishing label events (e.g., wss://relay.divine.video)
# FARO_RELAY_URL - Nostr relay for faro moderation events
# SIGHTENGINE_API_USER - (optional, for fallback)
# SIGHTENGINE_API_SECRET - (optional, for fallback)
# HIVE_* secrets are intentionally unused by upload moderation and classification entry points.
# Do not set them for production unless re-enabling an explicit, reviewed Hive integration.
# RELAY_ADMIN_URL - relay-admin API host. Default in src/index.mjs is api-relay-prod.divine.video
# (divine-relay-admin-api-prod worker, has NOSTR_NSEC binding). Override to
# api-relay-staging.divine.video or relay.admin.divine.video only when needed.
# Only used for the public-edge fallback; the RELAY_ADMIN service binding is preferred.
# RELAY_ADMIN_API_KEY is NOT a per-worker secret — it is the Secrets Store binding
# defined above (secret MODERATION_TO_RELAY_ADMIN_KEY), sent as the X-Admin-Key header.
# REALITY_DEFENDER_API_KEY - Reality Defender API key for secondary AI verification (api.prd.realitydefender.xyz)
# ADMIN_PASSWORD_HASH - SHA-256 hash of admin dashboard password
# ATPROTO_LABELER_WEBHOOK_URL - URL of the divine-labeler webhook endpoint (https://labels.divine.video/webhook/moderation-result)
# ATPROTO_LABELER_TOKEN - Bearer token for authenticating to the labeler webhook
